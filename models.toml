# latte-tune model configuration
# API key supports env var substitution: ${ANTHROPIC_API_KEY}
#
# Usage:
#   latte-tune sweep --config models.toml claude
#   latte-tune sweep --config models.toml deepseek

[[models]]
id = "claude-sonnet-4-20250514"
name = "Claude Sonnet 4"
api = "anthropic"
provider = "anthropic"
base_url = "https://api.anthropic.com"
api_key = "${ANTHROPIC_API_KEY}"
context_window = 200000
max_tokens = 8192

