# vendors.toml — 厂商抽象配置示例
#
# 自动发现路径：
#   1. `latte-tune vendors --config <path>`
#   2. ./vendors.toml
#   3. ~/.latte/vendors.toml

[[vendors]]
id = "anthropic"
protocol = "anthropic"
base_url = "https://api.anthropic.com"
auth = { type = "api_key", key = "${ANTHROPIC_API_KEY}" }
# 禁用 1 小时 cache TTL（beta header），仅用 ephemeral
disabled_features = ["extended_cache_ttl"]
health_check = { type = "http", path = "/v1/messages" }
discovery = "anthropic"

[[vendors]]
id = "deepseek"
protocol = "openai"
base_url = "https://api.deepseek.com"
# Bearer + 1h 自动刷新：过期时从 DEEPSEEK_TOKEN env 读新值
auth = { type = "bearer", token = "initial", interval_secs = 3600, refresh_env = "DEEPSEEK_TOKEN" }
discovery = "openai"

[[vendors]]
id = "openai"
protocol = "openai"
base_url = "https://api.openai.com"
auth = { type = "api_key", key = "${OPENAI_API_KEY}" }
health_check = { type = "http", path = "/v1/models" }
discovery = "openai"

[[vendors]]
id = "local-ollama"
base_url = "http://localhost:11434"
auth = { type = "api_key", key = "ollama" }
discovery = { type = "manual", models = [
    { id = "qwen2.5-coder:7b", display_name = "Qwen 2.5 Coder 7B", context_window = 8192 },
    { id = "llama3.1:8b",      display_name = "Llama 3.1 8B" },
    { id = "deepseek-r1:7b",   display_name = "DeepSeek R1 7B (distill)", context_window = 16384 }
] }
