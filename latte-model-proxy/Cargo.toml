[package]
name = "latte-model-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP proxy server that fronts multiple downstream AI model vendors (Ollama / OpenAI / Anthropic compatible)"

[[bin]]
name = "latte-model-proxy"
path = "src/main.rs"

[lib]
name = "latte_model_proxy"
path = "src/lib.rs"

[dependencies]
latte-ai = { path = "../latte-ai" }
latte-router = { path = "../latte-router" }
tokio = { workspace = true, features = ["signal"] }
axum = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }


[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
futures-util = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
